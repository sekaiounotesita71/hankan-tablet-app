<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" type="image/jpeg" href="./yumirume-logo.jpg">
  <title>外部作業入力 | ゆみるめ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--text:#17212b;--muted:#66717d;--line:#d8dee5;--line2:#b9c3cd;--bg:#eef2f5;--white:#fff;--blue:#175ea8;--blue-bg:#eaf3fc;--green:#177447;--green-bg:#eaf7ef;--red:#b42318;--red-bg:#fff0ef;--amber:#916100;--amber-bg:#fff7df}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;font-size:14px;letter-spacing:0}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}
    header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff}.brand-lockup{display:flex;align-items:center;gap:9px}.brand-logo{display:block;width:52px;height:32px;object-fit:contain}.brand{font-size:18px;font-weight:900}.header-sub{color:var(--muted);font-size:12px;font-weight:800}.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .btn{min-height:38px;padding:0 13px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--text);font-weight:900}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.success{border-color:var(--green);background:var(--green);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;min-height:27px;padding:0 9px;border-radius:999px;background:#f0f2f4;color:var(--muted);font-size:12px;font-weight:900}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.green{background:var(--green-bg);color:var(--green)}.pill.warn{background:var(--amber-bg);color:var(--amber)}
    main{max-width:1540px;margin:0 auto;padding:12px}.login{display:grid;grid-template-columns:minmax(220px,1fr) minmax(180px,1fr) auto;gap:8px;max-width:760px;margin:28px auto;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff}.login-title{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900}.login-logo{display:block;width:88px;height:54px;object-fit:contain}.login input{height:42px;border:1px solid var(--line2);border-radius:6px;padding:0 10px}.hidden{display:none!important}
    .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}.side,.workspace{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:8px 11px;border-bottom:1px solid var(--line);background:#f8fafb;font-weight:900}.assignment-list{max-height:calc(100vh - 140px);overflow:auto}.assignment{width:100%;padding:10px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.assignment:hover,.assignment.active{background:var(--blue-bg)}.assignment-date{font-family:Consolas,monospace;font-weight:900}.assignment-name{margin-top:4px;font-weight:900}.assignment-meta{margin-top:3px;color:var(--muted);font-size:12px}.empty{padding:30px 16px;color:var(--muted);text-align:center;font-weight:800}
    .workspace-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line)}.workspace-title{margin-right:auto;font-size:16px;font-weight:900}.save-state{color:var(--muted);font-size:12px;font-weight:800}.table-wrap{max-height:calc(100vh - 196px);overflow:auto}.work-table{width:100%;min-width:1760px;border-collapse:separate;border-spacing:0}.work-table th,.work-table td{padding:6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}.work-table th{position:sticky;top:0;z-index:3;background:#f4f7f9;color:var(--muted);font-size:12px;font-weight:900}.work-table td{background:#fff}.work-table tr.complete td{background:#f0faf4}.work-table tr.stockout td{background:#fff4f2}.work-table tr.invalid td{box-shadow:inset 0 2px var(--red),inset 0 -2px var(--red)}.work-table input,.work-table select{height:36px;border:1px solid var(--line2);border-radius:5px;padding:0 7px;background:#fff}.work-table input:focus,.work-table select:focus{border-color:var(--blue);outline:2px solid rgba(23,94,168,.18)}.num{width:82px;text-align:right}.unit{width:76px}.origin{width:130px}.memo{width:180px}.box-input{display:flex;align-items:center;gap:4px}.box-prefix{font-family:Consolas,monospace;font-weight:900}.box-sequence{width:82px}.check{width:20px;height:20px;min-height:20px!important}.product{max-width:230px;overflow:hidden;text-overflow:ellipsis}.customer{max-width:190px;overflow:hidden;text-overflow:ellipsis;font-weight:900}.phase-mark{display:inline-flex;min-height:22px;align-items:center;padding:0 6px;border-radius:4px;background:#eef1f4;color:var(--muted);font-size:11px;font-weight:900}.phase-mark.p1{background:var(--blue-bg);color:var(--blue)}.phase-mark.p2{background:var(--green-bg);color:var(--green)}
    .toast{position:fixed;left:50%;bottom:18px;z-index:50;transform:translateX(-50%) translateY(90px);max-width:min(560px,92vw);padding:11px 15px;border-radius:7px;background:#17212b;color:#fff;font-weight:800;opacity:0;transition:.18s}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.busy{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.75)}.busy.open{display:flex}.busy-box{padding:16px 20px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900;box-shadow:0 8px 28px rgba(0,0,0,.16)}
    @media(max-width:900px){header{align-items:flex-start}.layout{grid-template-columns:1fr}.assignment-list{display:flex;max-height:none;overflow:auto}.assignment{min-width:210px;border-right:1px solid var(--line)}.table-wrap{max-height:none}.login{grid-template-columns:1fr}.login-title{grid-column:auto}.workspace-tools{position:sticky;top:58px;z-index:10;background:#fff}}
  </style>
</head>
<body>
<header>
  <div class="brand-lockup"><img class="brand-logo" src="./yumirume-logo.jpg" alt="YUMIRUME INC."><div><div class="brand">外部作業入力</div><div class="header-sub">割り当てられた商品のみ表示されます</div></div></div>
  <div class="header-actions"><span id="auth-label" class="pill warn">未ログイン</span><button id="logout-btn" class="btn hidden" type="button" onclick="signOut()">ログアウト</button></div>
</header>
<main>
  <section id="login-panel" class="login">
    <div class="login-title"><img class="login-logo" src="./yumirume-logo.jpg" alt="YUMIRUME INC."><span>担当者ログイン</span></div>
    <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
    <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
    <button class="btn primary" type="button" onclick="signIn()">ログイン</button>
  </section>
  <section id="app-panel" class="layout hidden">
    <aside class="side">
      <div class="section-head"><span>作業依頼</span><button class="btn" type="button" onclick="loadAssignments()">更新</button></div>
      <div id="assignment-list" class="assignment-list"><div class="empty">読込中...</div></div>
    </aside>
    <section class="workspace">
      <div class="section-head"><span>入力明細</span><span id="assignment-status" class="pill">未選択</span></div>
      <div id="workspace-empty" class="empty">左の作業依頼を選択してください。</div>
      <div id="workspace-content" class="hidden">
        <div class="workspace-tools">
          <div id="workspace-title" class="workspace-title"></div>
          <span id="save-state" class="save-state">変更は自動保存されます</span>
          <button id="submit-btn" class="btn success" type="button" onclick="submitAssignment()">全明細を提出</button>
        </div>
        <div class="table-wrap">
          <table class="work-table">
            <thead><tr>
              <th>完了</th><th>得意先</th><th>商品</th><th>注文</th>
              <th><span class="phase-mark p1">1</span> 数量</th><th>単位</th><th>NET</th><th>産地</th><th>欠品</th><th>メモ</th>
              <th><span class="phase-mark p2">2</span> 箱番号</th><th>グロス</th><th>DI</th><th>DI重量</th><th>箱サイズ</th>
              <th>仕入単価</th><th>単価単位</th>
            </tr></thead>
            <tbody id="work-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </section>
</main>
<div id="toast" class="toast"></div>
<div id="busy" class="busy"><div id="busy-text" class="busy-box">処理中...</div></div>
<script>
const SUPABASE_URL="https://bvgjscxyjosjqqhxutyk.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2Z2pzY3h5am9zanFxaHh1dHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTc3ODgsImV4cCI6MjA5NDc5Mzc4OH0.-C7xeh8e-OW4QsJDGV4TRdVcHWmaF-nydbvSjNP25Hg";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null;
let assignments=[];
let currentAssignment=null;
let currentLines=[];
let inputByLine=new Map();
let saveTimers=new Map();
let saveChains=new Map();
let editVersions=new Map();
let savedVersions=new Map();
let realtimeChannel=null;
const statusLabels={published:"未着手",in_progress:"入力中",submitted:"提出済み",accepted:"確認済み",returned:"差し戻し"};
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}
function num(value){const text=String(value??"").replace(/,/g,"").trim();if(!text)return null;const n=Number(text);return Number.isFinite(n)?n:null}
function normalizeUnit(value){const key=String(value||"").trim().toLowerCase();return ({kg:"Kg",pkt:"pkt",pc:"PC",cs:"CS"})[key]||"Kg"}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
function busy(active,message="処理中..."){document.getElementById("busy").classList.toggle("open",!!active);document.getElementById("busy-text").textContent=message}
function setAuthUi(){const logged=!!currentUser;document.getElementById("login-panel").classList.toggle("hidden",logged);document.getElementById("app-panel").classList.toggle("hidden",!logged);document.getElementById("logout-btn").classList.toggle("hidden",!logged);const label=document.getElementById("auth-label");label.textContent=logged?(currentUser.email||"ログイン済み"):"未ログイン";label.className=`pill ${logged?"blue":"warn"}`}
async function signIn(){const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;if(!email||!password){toast("メールとパスワードを入力してください");return}busy(true,"ログイン中...");const {error}=await client.auth.signInWithPassword({email,password});busy(false);if(error){toast("ログインできません: "+error.message);return}document.getElementById("password").value=""}
async function signOut(){await client.auth.signOut()}
async function init(){const {data}=await client.auth.getSession();currentUser=data.session?.user||null;setAuthUi();if(currentUser)await loadAssignments();client.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;setAuthUi();if(currentUser)await loadAssignments();else clearWorkspace()})}
function clearWorkspace(){for(const timer of saveTimers.values())clearTimeout(timer);saveTimers.clear();saveChains.clear();editVersions.clear();savedVersions.clear();assignments=[];currentAssignment=null;currentLines=[];inputByLine.clear();document.getElementById("assignment-list").innerHTML='<div class="empty">ログインしてください。</div>';document.getElementById("workspace-empty").classList.remove("hidden");document.getElementById("workspace-content").classList.add("hidden");if(realtimeChannel){client.removeChannel(realtimeChannel);realtimeChannel=null}}
async function loadAssignments(){if(!currentUser)return;const {data,error}=await client.from("external_work_assignments").select("*").not("status","in","(draft,cancelled)").order("work_date",{ascending:false}).order("created_at",{ascending:false}).limit(200);if(error){document.getElementById("assignment-list").innerHTML='<div class="empty">外部作業用SQLを確認してください。</div>';toast(error.message);return}assignments=data||[];renderAssignmentList();if(currentAssignment){const found=assignments.find(row=>row.id===currentAssignment.id);if(found)await openAssignment(found.id)}else if(assignments.length)await openAssignment(assignments[0].id)}
function renderAssignmentList(){const box=document.getElementById("assignment-list");if(!assignments.length){box.innerHTML='<div class="empty">現在の作業依頼はありません。</div>';return}box.innerHTML=assignments.map(row=>`<button class="assignment ${currentAssignment?.id===row.id?"active":""}" type="button" onclick="openAssignment('${esc(row.id)}')"><div class="assignment-date">${esc(row.work_date)} / ${esc(row.site_code)}</div><div class="assignment-name">${esc(row.supplier_name_snapshot||row.supplier_code)}</div><div class="assignment-meta">${esc(statusLabels[row.status]||row.status)}</div></button>`).join("")}
async function openAssignment(id){const assignment=assignments.find(row=>row.id===id);if(!assignment)return;currentAssignment=assignment;renderAssignmentList();busy(true,"作業明細を読み込み中...");const [lineResult,inputResult]=await Promise.all([client.from("external_work_assignment_lines").select("*").eq("assignment_id",id).eq("active",true).order("customer_name").order("line_no"),client.from("external_work_inputs").select("*,external_work_assignment_lines!inner(assignment_id)").eq("external_work_assignment_lines.assignment_id",id)]);busy(false);if(lineResult.error||inputResult.error){toast((lineResult.error||inputResult.error).message);return}currentLines=lineResult.data||[];inputByLine=new Map((inputResult.data||[]).map(input=>[input.assignment_line_id,input]));editVersions=new Map(currentLines.map(line=>[line.id,0]));savedVersions=new Map(currentLines.map(line=>[line.id,0]));renderWorkspace();subscribeRealtime(id)}
function blankInput(line){const unit=normalizeUnit(line.ordered_unit);return{assignment_line_id:line.id,input_qty:"",input_unit:unit,net_weight:"",origin:"",box_sequence:"",gross_weight:"",dry_ice_enabled:false,dry_ice_weight:"",box_size:"",memo:"",purchase_unit_price:"",purchase_price_unit:unit,is_stockout:false,completed:false}}
function valueFor(lineId,key){const input=inputByLine.get(lineId)||blankInput({id:lineId});return input[key]??""}
function assignmentLocked(){return ["submitted","accepted"].includes(currentAssignment?.status)}
function updateWorkspaceHeader(){const locked=assignmentLocked();document.getElementById("workspace-title").textContent=`${currentAssignment.work_date} ${currentAssignment.site_code} / ${currentAssignment.supplier_name_snapshot||currentAssignment.supplier_code}`;const status=document.getElementById("assignment-status");status.textContent=statusLabels[currentAssignment.status]||currentAssignment.status;status.className=`pill ${currentAssignment.status==="accepted"?"green":currentAssignment.status==="returned"?"warn":"blue"}`;document.getElementById("submit-btn").disabled=locked;document.getElementById("submit-btn").textContent=currentAssignment.status==="accepted"?"本社確認済み":currentAssignment.status==="submitted"?"提出済み":"全明細を提出"}
function renderWorkspace(){const locked=assignmentLocked();document.getElementById("workspace-empty").classList.add("hidden");document.getElementById("workspace-content").classList.remove("hidden");updateWorkspaceHeader();const prefix=currentAssignment.box_prefix_snapshot||"";document.getElementById("work-body").innerHTML=currentLines.map(line=>{const input=inputByLine.get(line.id)||blankInput(line);const disabled=locked?"disabled":"";return `<tr class="${input.completed?"complete":""} ${input.is_stockout?"stockout":""}" data-line-id="${esc(line.id)}"><td><input class="check" type="checkbox" ${input.completed?"checked":""} ${disabled} onchange="changeField('${esc(line.id)}','completed',this.checked)"></td><td class="customer" title="${esc(line.customer_name)}">${esc(line.customer_name)}</td><td class="product" title="${esc(line.product_name)}"><b>${esc(line.product_code||"")}</b> ${esc(line.product_name)}</td><td>${esc(line.ordered_qty??"")} ${esc(line.ordered_unit||"")}</td><td><input class="num" data-field="input_qty" inputmode="decimal" value="${esc(input.input_qty??"")}" ${disabled} onchange="changeField('${esc(line.id)}','input_qty',this.value)"></td><td><select class="unit" ${disabled} onchange="changeField('${esc(line.id)}','input_unit',this.value)">${unitOptions(input.input_unit)}</select></td><td><input class="num" data-field="net_weight" inputmode="decimal" value="${esc(input.net_weight??"")}" ${disabled} onchange="changeField('${esc(line.id)}','net_weight',this.value)"></td><td><input class="origin" lang="en" autocapitalize="none" value="${esc(input.origin||"")}" ${disabled} onchange="changeField('${esc(line.id)}','origin',this.value)"></td><td><input class="check" type="checkbox" ${input.is_stockout?"checked":""} ${disabled} onchange="changeField('${esc(line.id)}','is_stockout',this.checked)"></td><td><input class="memo" value="${esc(input.memo||"")}" ${disabled} onchange="changeField('${esc(line.id)}','memo',this.value)"></td><td><div class="box-input"><span class="box-prefix">${esc(prefix)}${prefix?"-":""}</span><input class="box-sequence" inputmode="numeric" value="${esc(input.box_sequence||"")}" ${disabled} onchange="changeField('${esc(line.id)}','box_sequence',this.value)"></div></td><td><input class="num" inputmode="decimal" value="${esc(input.gross_weight??"")}" ${disabled} onchange="changeField('${esc(line.id)}','gross_weight',this.value)"></td><td><input class="check" type="checkbox" ${input.dry_ice_enabled?"checked":""} ${disabled} onchange="changeField('${esc(line.id)}','dry_ice_enabled',this.checked)"></td><td><input class="num" inputmode="decimal" value="${esc(input.dry_ice_weight??"")}" ${disabled} onchange="changeField('${esc(line.id)}','dry_ice_weight',this.value)"></td><td><select ${disabled} onchange="changeField('${esc(line.id)}','box_size',this.value)">${boxSizeOptions(input.box_size)}</select></td><td><input class="num" inputmode="decimal" value="${esc(input.purchase_unit_price??"")}" ${disabled} onchange="changeField('${esc(line.id)}','purchase_unit_price',this.value)"></td><td><select class="unit" ${disabled} onchange="changeField('${esc(line.id)}','purchase_price_unit',this.value)">${unitOptions(input.purchase_price_unit)}</select></td></tr>`}).join("")||'<tr><td colspan="17" class="empty">明細がありません。</td></tr>'}
function unitOptions(value){return ["Kg","pkt","PC","CS"].map(unit=>`<option value="${unit}" ${String(value||"").toLowerCase()===unit.toLowerCase()?"selected":""}>${unit}</option>`).join("")}
function boxSizeOptions(value){return ["","小","中","大","特大"].map(size=>`<option value="${esc(size)}" ${value===size?"selected":""}>${esc(size||"選択")}</option>`).join("")}
function changeField(lineId,key,value){const line=currentLines.find(row=>row.id===lineId);if(!line)return;const input={...(inputByLine.get(lineId)||blankInput(line)),[key]:value};if(key==="is_stockout"&&value){input.input_qty=0;input.net_weight=0}inputByLine.set(lineId,input);editVersions.set(lineId,(editVersions.get(lineId)||0)+1);const row=document.querySelector(`tr[data-line-id="${CSS.escape(lineId)}"]`);row?.classList.remove("invalid");row?.classList.toggle("complete",!!input.completed);row?.classList.toggle("stockout",!!input.is_stockout);if(key==="is_stockout"&&value){const qty=row?.querySelector('[data-field="input_qty"]');const net=row?.querySelector('[data-field="net_weight"]');if(qty)qty.value="0";if(net)net.value="0"}document.getElementById("save-state").textContent="保存中...";clearTimeout(saveTimers.get(lineId));saveTimers.set(lineId,setTimeout(()=>{saveTimers.delete(lineId);queueLineSave(lineId)},220))}
async function saveLineNow(lineId){const input=inputByLine.get(lineId);if(!input)return false;const version=editVersions.get(lineId)||0;const snapshot={...input};const {data,error}=await client.rpc("save_partner_work_input",{p_assignment_line_id:lineId,p_input_qty:num(snapshot.input_qty),p_input_unit:normalizeUnit(snapshot.input_unit),p_net_weight:num(snapshot.net_weight),p_origin:snapshot.origin||null,p_box_sequence:snapshot.box_sequence||null,p_gross_weight:num(snapshot.gross_weight),p_dry_ice_enabled:!!snapshot.dry_ice_enabled,p_dry_ice_weight:num(snapshot.dry_ice_weight),p_box_size:snapshot.box_size||null,p_memo:snapshot.memo||null,p_purchase_unit_price:num(snapshot.purchase_unit_price),p_purchase_price_unit:normalizeUnit(snapshot.purchase_price_unit),p_is_stockout:!!snapshot.is_stockout,p_completed:!!snapshot.completed,p_expected_updated_at:snapshot.updated_at||null});if(error){document.getElementById("save-state").textContent="保存失敗";toast(error.message);if(/another user updated/i.test(String(error.message||"")))setTimeout(()=>openAssignment(currentAssignment.id),500);return false}const saved=Array.isArray(data)?data[0]:data;if(!saved?.updated_at){document.getElementById("save-state").textContent="保存確認失敗";toast("保存結果を確認できませんでした");return false}const latest=inputByLine.get(lineId)||snapshot;const changed=(editVersions.get(lineId)||0)!==version;inputByLine.set(lineId,changed?{...saved,...latest,updated_at:saved.updated_at}:saved);savedVersions.set(lineId,version);document.getElementById("save-state").textContent=`自動保存済み ${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;if(currentAssignment.status==="published"){currentAssignment.status="in_progress";renderAssignmentList();updateWorkspaceHeader()}return true}
function queueLineSave(lineId){const previous=saveChains.get(lineId)||Promise.resolve(true);const next=previous.catch(()=>false).then(()=>saveLineNow(lineId));saveChains.set(lineId,next);next.finally(()=>{if(saveChains.get(lineId)===next)saveChains.delete(lineId)});return next}
async function flushSaves(){for(const timer of saveTimers.values())clearTimeout(timer);saveTimers.clear();if(saveChains.size)await Promise.all([...saveChains.values()]);const dirty=currentLines.filter(line=>(editVersions.get(line.id)||0)!==(savedVersions.get(line.id)||0));if(!dirty.length)return true;const results=await Promise.all(dirty.map(line=>queueLineSave(line.id)));return results.every(Boolean)}
function inputIssue(input){if(!input?.completed)return "完了未チェック";if(input.is_stockout)return "";if(!(num(input.input_qty)>0))return "数量";if(!(num(input.net_weight)>0))return "NET";if(!String(input.origin||"").trim())return "産地";if(!String(input.box_sequence||"").trim())return "箱番号";if(!(num(input.gross_weight)>0))return "グロス";if(!String(input.box_size||"").trim())return "箱サイズ";if(num(input.purchase_unit_price)===null)return "仕入単価";if(input.dry_ice_enabled&&!(num(input.dry_ice_weight)>0))return "DI重量";return ""}
async function submitAssignment(){if(!currentAssignment)return;const issues=currentLines.map(line=>({line,issue:inputIssue(inputByLine.get(line.id))})).filter(item=>item.issue);document.querySelectorAll("#work-body tr.invalid").forEach(row=>row.classList.remove("invalid"));if(issues.length){const first=issues[0];const row=document.querySelector(`tr[data-line-id="${CSS.escape(first.line.id)}"]`);row?.classList.add("invalid");row?.scrollIntoView({block:"center",inline:"nearest"});toast(`未完了または未入力が ${issues.length}件あります（最初: ${first.issue}）`);return}if(!confirm("全明細を提出します。提出後は本社が差し戻すまで修正できません。"))return;busy(true,"作業内容を提出しています...");if(!(await flushSaves())){busy(false);return}const {error}=await client.rpc("submit_partner_work_assignment",{p_assignment_id:currentAssignment.id});busy(false);if(error){toast(error.message);return}toast("提出しました");await loadAssignments()}
function subscribeRealtime(assignmentId){if(realtimeChannel)client.removeChannel(realtimeChannel);realtimeChannel=client.channel(`partner-work-${assignmentId}`).on("postgres_changes",{event:"UPDATE",schema:"public",table:"external_work_assignments",filter:`id=eq.${assignmentId}`},payload=>{const index=assignments.findIndex(row=>row.id===payload.new.id);if(index>=0)assignments[index]=payload.new;if(currentAssignment?.id===payload.new.id){const wasLocked=assignmentLocked();currentAssignment=payload.new;renderAssignmentList();if(wasLocked!==assignmentLocked())renderWorkspace();else updateWorkspaceHeader()}}).subscribe()}
window.addEventListener("beforeunload",event=>{if(saveTimers.size||saveChains.size){event.preventDefault();event.returnValue=""}});
init();
</script>

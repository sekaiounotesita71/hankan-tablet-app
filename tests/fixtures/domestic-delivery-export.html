<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>納品書データ ローカルテスト</title><link rel="stylesheet" href="../../domestic-delivery-export.css"><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script><script src="../../domestic-delivery-export.js" defer></script><script src="../../domestic-delivery-export-app.js" defer></script><style>body{margin:0;font:14px/1.5 Meiryo,sans-serif;color:#192128;background:#f4f6f7}header{padding:15px;border-bottom:1px solid #b5bec8;background:#fff;display:flex;gap:14px;align-items:center}header img{width:100px}header b{font-size:17px}main{padding:20px;max-width:1000px;margin:auto}button{padding:8px 14px;border:1px solid #8b98a2;border-radius:5px;background:#fff;font:inherit}label{display:inline-flex;gap:7px;margin-left:15px}output{display:block;margin-top:12px}.test-status{font-size:12px;color:#52616d}</style></head>
<body><header><img src="../../yumirume-logo.jpg" alt="YUMIRUME"><div><b>納品書データ</b><div class="test-status">ローカル / テストデータ / 本番未接続</div></div></header><main><button type="button" onclick="openDomesticDeliveryExport('sale-demo')">見本を開く</button><label><input type="checkbox" id="simulate-failure">保存エラー</label><output id="test-message" role="status"></output></main>
<script>
var demoSale={id:'sale-demo',status:'confirmed',sale_no:'LOCAL-20261119',sale_date:'2026-11-19',customer_code:'LOCAL',customer_name_snapshot:'J NEXT テスト',source_session_id:'session-demo',source_importer_code:'10',lines:[

{id:'line-2',sale_id:'sale-demo',line_no:2,source_sales_record_id:'source-2',product_name_snapshot:'生本マグロ',quantity:3.3,unit:'Kg',unit_price_jpy:6200,net_amount_jpy:20460,external_order_no:'6',delivery_carton_no:null,delivery_spec:null,delivery_customer_name:null,delivery_export_revision:0,delivery_metadata_saved:false},
{id:'line-3',sale_id:'sale-demo',line_no:3,source_sales_record_id:'source-3',product_name_snapshot:'養殖シマアジ(水)',quantity:1.4,unit:'Kg',unit_price_jpy:3000,net_amount_jpy:4200,external_order_no:'7',delivery_carton_no:null,delivery_spec:null,delivery_customer_name:null,delivery_export_revision:0,delivery_metadata_saved:false}]};
var demoSources=[
{id:'source-1',session_id:'session-demo',importer_code:'10',store_name:'FB(TMR10)',external_order_no:'0005',box_no:'9',origin:'北海道',net_weight:3,ordered_qty:3,ordered_unit:'kg',input_qty:3,input_unit:'Kg'},
{id:'source-2',session_id:'session-demo',importer_code:'10',store_name:'Yamu Restaurant\nBangkok',external_order_no:'6',box_no:'6',origin:'大分',net_weight:3.3,ordered_qty:3,ordered_unit:'kg',input_qty:3.3,input_unit:'Kg'},
{id:'source-3',session_id:'session-demo',importer_code:'10',store_name:'MISHO',external_order_no:'7',box_no:'11',origin:'愛媛',net_weight:1.4,ordered_qty:1,ordered_unit:'尾',input_qty:1.4,input_unit:'Kg'}];
function domesticSaleForDocument(){return Promise.resolve(structuredClone(demoSale))}
function showToast(message){document.getElementById('test-message').textContent=message}
function fetchPaged(factory){return Promise.resolve(structuredClone(factory().data))}
var supabaseClient={from(){return{data:demoSources,select(){return this},in(k,ids){this.data=this.data.filter(r=>ids.includes(r[k]));return this},order(){return this}}},async rpc(name,args){
if(name!=='save_domestic_delivery_metadata')throw Error('Unexpected RPC');
if(document.getElementById('simulate-failure').checked)return{error:{message:'テスト保存エラー'}};
if(args.p_sale_id!==demoSale.id||args.p_lines.length!==demoSale.lines.length)return{error:{message:'明細不一致'}};
if(args.p_lines.some(p=>demoSale.lines.find(l=>l.id===p.id)?.delivery_export_revision!==p.expected_revision))return{error:{message:'Delivery metadata changed. Reload before saving.'}};
args.p_lines.forEach(p=>{var l=demoSale.lines.find(l=>l.id===p.id);for(var key of ['external_order_no','delivery_carton_no','delivery_spec','delivery_customer_name'])l[key]=p[key]||null;l.delivery_export_revision++;l.delivery_metadata_saved=true});
document.getElementById('test-message').textContent='テスト保存済み / 金額・数量変更なし';return{data:{sale_id:demoSale.id,lines:structuredClone(demoSale.lines)},error:null};}};
</script></body></html>
